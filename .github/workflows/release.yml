name: Release Data Platform Tarball

on:
  push:
    tags:
      - 'rel-*'
  # Manual dispatch is a rehearsal by default: it assembles the tarball end to end, including
  # downloading the three sibling JARs, but stops before publishing.  Publishing is gated on
  # dry_run, and the tag push path is unaffected.  Without this the workflow -- and in
  # particular the release-notes wiring below -- could only be exercised by cutting a real
  # release.  Follows the pattern in dp-desktop-app.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the rel- prefix (e.g. 1.16.0).  Must exist as rel-<version> in dp-grpc, dp-service, and dp-desktop-app."
        required: true
      dry_run:
        description: "Build only; do not publish a GitHub Release"
        required: false
        type: boolean
        default: true

env:
  DP_SERVICE_REPO: osprey-dcs/dp-service
  DP_DESKTOP_APP_REPO: osprey-dcs/dp-desktop-app
  DP_GRPC_REPO: osprey-dcs/dp-grpc

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      # A dry run assembles and verifies the tarball but never publishes a release.  A rel-*
      # tag push always publishes; a manual dispatch defaults to a dry run and must opt in.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:

      # Checkout data-platform repo
      - name: Checkout
        # Actions are pinned to commit SHAs rather than floating major tags: this job
        # downloads the release JARs of three sibling repos and publishes the tarball users
        # install from, so a compromised upstream tag here could alter what ships.  See the
        # convention in CLAUDE.md.  Dependabot (.github/dependabot.yml) keeps the pins current.
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      # On a tag push the version comes from the tag.  On a manual dispatch GITHUB_REF_NAME is
      # the branch, not a tag, so the version has to be supplied as an input -- it selects
      # which rel-<version> of the sibling repos to download JARs from.
      - name: Set VERSION env
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#rel-}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" != rel-* ]]; then
              echo "::error::Tag does not start with 'rel-': $TAG"
              exit 1
            fi
            VERSION="${TAG#rel-}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Building version ${VERSION}"

      # Checked up front rather than left to action-gh-release, which fails the job on a
      # missing body_path only after the sibling-repo JARs have been downloaded and the
      # tarball uploaded.  Every release from 1.16.0 on ships notes; see
      # doc/developer/release.md.
      #
      # The path is derived from VERSION rather than GITHUB_REF_NAME because on a manual
      # dispatch GITHUB_REF_NAME is the branch, so it would look for doc/release-notes/main.md.
      # On a tag push the two are identical.
      - name: Verify release notes exist
        shell: bash
        run: |
          set -euo pipefail
          NOTES="doc/release-notes/rel-${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            # A dry run rehearses the build before the notes are written, so it warns rather
            # than failing; the publishing path always fails.  DRY_RUN is a job-level env and
            # so always exported -- as the empty string on a tag push, which set -u would
            # otherwise trip on.
            if [[ "${DRY_RUN:-}" == "true" ]]; then
              echo "::warning::Release notes not found at $NOTES -- a real run would fail here."
              exit 0
            fi
            echo "::error::Release notes not found at $NOTES."
            echo "::error::Add the notes for ${VERSION} and re-run, or retag once they are on the tagged commit."
            exit 1
          fi
          echo "NOTES_PATH=$NOTES" >> $GITHUB_ENV

      # Create directory structure
      - name: Create installer directories
        run: |
          mkdir -p data-platform/config
          mkdir -p data-platform/bin
          mkdir -p data-platform/docker
          mkdir -p data-platform/kubernetes
          mkdir -p data-platform/lib
          mkdir -p data-platform/templates
          mkdir -p data-platform/proto
          mkdir -p data-platform/var/lock
          mkdir -p data-platform/var/log

      # Copy static config and templates from repo
      - name: Copy config and templates
        run: |
          cp config/* data-platform/config/ || true
          cp templates/* data-platform/templates/ || true
          test -e README.env && cp README.env data-platform/ || true

      # Copy support scripts (optional, if hosted in repo)
      - name: Copy support scripts
        run: |
          test -d bin && cp -r bin/* data-platform/bin/ || true

      - name: Copy docker and kubernetes assets
        run: |
          test -d docker && cp -r docker data-platform/ || true
          test -d kubernetes && cp -r kubernetes data-platform/ || true

      - name: Download dp-grpc release JAR
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ${{ env.DP_GRPC_REPO }}
          tag: rel-${{ env.VERSION }}
          fileName: dp-grpc-${{ env.VERSION }}.jar
          out-file-path: data-platform/lib
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize dp-grpc JAR name
        run: |
          mv data-platform/lib/dp-grpc-${VERSION}.jar \
             data-platform/lib/dp-grpc.jar

      - name: Download dp-service release JAR
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ${{ env.DP_SERVICE_REPO }}
          tag: rel-${{ env.VERSION }}
          fileName: dp-service-${{ env.VERSION }}.jar
          out-file-path: data-platform/lib
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Normalize dp-service JAR name
        run: |
          mv data-platform/lib/dp-service-${VERSION}.jar \
             data-platform/lib/dp-service.jar

      - name: Download dp-desktop-app release JAR
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: ${{ env.DP_DESKTOP_APP_REPO }}
          tag: rel-${{ env.VERSION }}
          fileName: dp-desktop-app-${{ env.VERSION }}.jar
          out-file-path: data-platform/lib
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Normalize dp-desktop-app JAR name
        run: |
          mv data-platform/lib/dp-desktop-app-${VERSION}.jar \
             data-platform/lib/dp-desktop-app.jar

      - name: Verify lib contents
        run: |
          ls -lh data-platform/lib

      - name: Ensure all jars present
        run: |
          test -f data-platform/lib/dp-grpc.jar
          test -f data-platform/lib/dp-service.jar
          test -f data-platform/lib/dp-desktop-app.jar

      # Create tarball
      - name: Create tarball
        run: |
          TAR_FILE=data-platform-${{ env.VERSION }}.tar.gz
          tar czf data-platform-${VERSION}.tar.gz data-platform
          echo "Created tarball: $TAR_FILE"

      - name: Generate checksum
        run: |
          sha256sum data-platform-${{ env.VERSION }}.tar.gz \
            > data-platform-${{ env.VERSION }}.tar.gz.sha256

      # Everything above this point -- downloading the sibling JARs, assembling the tarball,
      # checksumming it, and verifying the notes -- runs in a dry run too, so a rehearsal
      # exercises the whole job except the one step that writes.
      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            data-platform-${{ env.VERSION }}.tar.gz
            data-platform-${{ env.VERSION }}.tar.gz.sha256
          body_path: ${{ env.NOTES_PATH }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


